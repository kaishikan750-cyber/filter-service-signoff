name: 签收验收与演示构建
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true
      - run: flutter pub get
      - run: flutter test test/signoff_test.dart --reporter expanded
      - run: |
          flutter create --platforms=web --project-name filter_service_signoff "$RUNNER_TEMP/demo"
          cp -r lib pubspec.yaml "$RUNNER_TEMP/demo/"
          cd "$RUNNER_TEMP/demo"
          flutter build web --release --base-href /filter-service-signoff/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/demo/build/web
  publish-web:
    needs: test-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true
      - run: |
          flutter create --platforms=android --project-name filter_service_signoff "$RUNNER_TEMP/demo"
          cp -r lib pubspec.yaml "$RUNNER_TEMP/demo/"
          cd "$RUNNER_TEMP/demo"
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: filter-service-signoff-debug-apk
          path: ${{ runner.temp }}/demo/build/app/outputs/flutter-apk/app-debug.apk
